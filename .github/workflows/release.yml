name: Release

# Manual semantic version tags, not automated commit-driven versioning. Bump appVersionCode/
# appVersionName in gradle.properties (shared by the phone and watch apps), commit, then:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# That push is the only thing that triggers this workflow. It builds signed release APKs and
# AABs for both apps and attaches them to an auto-generated GitHub Release as
# medicine-reminder-phone-<tag>.apk/.aab and medicine-reminder-watch-<tag>.apk/.aab. Upload both
# AABs to the same Play Console app (the watch AAB goes to a Wear OS track); the APKs are for
# sideloading. Both apps MUST be signed with the same key or the Wearable Data Layer won't
# connect them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Secrets go through env, never ${{ }} inside the script, so their contents can't be
      # interpreted as shell.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/medicine-reminder-upload.jks
          {
            echo "storeFile=keystore/medicine-reminder-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APKs and AABs
        run: ./gradlew assembleRelease bundleRelease

      - name: Name release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/medicine-reminder-phone-${{ github.ref_name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/medicine-reminder-phone-${{ github.ref_name }}.aab"
          cp wear/build/outputs/apk/release/wear-release.apk "dist/medicine-reminder-watch-${{ github.ref_name }}.apk"
          cp wear/build/outputs/bundle/release/wear-release.aab "dist/medicine-reminder-watch-${{ github.ref_name }}.aab"

      - name: Remove signing key
        if: always()
        run: rm -rf keystore keystore.properties

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
